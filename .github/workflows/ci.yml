name: Node CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest #everytime github starts a fresh vm when this workflow runs

    steps:
      # git clone <repository>
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t supplychain-app .