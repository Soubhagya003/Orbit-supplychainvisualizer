events {}

http {

    server {

        listen 80; #nginx waits for http requests on port 80,cuz default HTTP port is 80

        location / {
            # / means for evry url

            proxy_pass http://app:8080; #whenver nginx receives a request forward it to app:8080

            proxy_http_version 1.1; #use HTTP/1.1 while talking to Node,This keeps features like keep-alive connections working correctly

            proxy_set_header Host $host;#nginx forwards the same header to Node

            proxy_set_header X-Real-IP $remote_addr;#this tells node the real IP of client

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #Node can see the complete chain of IPs

            proxy_set_header X-Forwarded-Proto $scheme; #Node can now know whether user came through http or https
        }

    }

}